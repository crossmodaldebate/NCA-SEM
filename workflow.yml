name: R-CMD-check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        r-version: ["4.4", "4.5"]

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}

      - name: Configurar Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libxml2-dev libssl-dev

      - name: Instalar pacotes necessários
        run: |
          Rscript -e 'install.packages(c("remotes", "rcmdcheck"), repos = "https://cloud.r-project.org")'
          Rscript -e 'deps <- c("lavaan", "NCA", "semPlot", "jmv", "matrixcalc"); install.packages(setdiff(deps, rownames(installed.packages())), repos = "https://cloud.r-project.org")'

      - name: Verificar o pacote
        env:
          _R_CHECK_FORCE_SUGGESTS_: false
          NOT_CRAN: true
        run: |
          Rscript -e 'rcmdcheck::rcmdcheck(args = c("--no-manual", "--as-cran"), error_on = "warning")'
